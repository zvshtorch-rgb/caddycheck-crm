name: Order intake poller

# Plain Python process (no Streamlit runtime) that scans the shared order mailbox
# through Microsoft Graph. Scheduled runs are LIVE only when the repository
# variable ORDER_INTAKE_LIVE is "true"; otherwise they are read-only dry-runs.
# Manual runs pick their mode explicitly.

on:
  schedule:
    # Every 15 minutes, 24/7. GitHub may start scheduled runs a few minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = connectivity/schema only, dry-run = list only, live = process"
        type: choice
        options: [check, dry-run, live]
        default: check
      since:
        description: "Targeted backfill start (ISO-8601). Live mode also needs only_from or subject_contains."
        required: false
        default: ""
      only_from:
        description: "Only messages whose sender contains this text"
        required: false
        default: ""
      subject_contains:
        description: "Only messages whose subject contains this text"
        required: false
        default: ""

permissions:
  contents: read

# Prevent overlapping runs if a poll takes longer than the interval.
concurrency:
  group: order-intake-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run order intake poller
        env:
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Approval links / recipients
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ORDER_APPROVAL_CEO_EMAIL: ${{ secrets.ORDER_APPROVAL_CEO_EMAIL }}
          # Mailbox access: Microsoft Graph application authentication
          ORDER_INTAKE_PROVIDER: graph
          ORDER_INTAKE_GRAPH_TENANT_ID: ${{ secrets.ORDER_INTAKE_GRAPH_TENANT_ID }}
          ORDER_INTAKE_GRAPH_CLIENT_ID: ${{ secrets.ORDER_INTAKE_GRAPH_CLIENT_ID }}
          ORDER_INTAKE_GRAPH_CLIENT_SECRET: ${{ secrets.ORDER_INTAKE_GRAPH_CLIENT_SECRET }}
          ORDER_INTAKE_GRAPH_MAILBOX: ${{ secrets.ORDER_INTAKE_GRAPH_MAILBOX }}
          ORDER_INTAKE_GRAPH_FOLDER: ${{ secrets.ORDER_INTAKE_GRAPH_FOLDER }}
          # Window / safety settings (repository variables, not secrets)
          ORDER_INTAKE_MIN_RECEIVED: ${{ vars.ORDER_INTAKE_MIN_RECEIVED }}
          ORDER_INTAKE_LOOKBACK_HOURS: ${{ vars.ORDER_INTAKE_LOOKBACK_HOURS }}
          ORDER_INTAKE_MAX_NEW_PER_RUN: ${{ vars.ORDER_INTAKE_MAX_NEW_PER_RUN }}
          # Run selection
          LIVE_ENABLED: ${{ vars.ORDER_INTAKE_LIVE }}
          IN_MODE: ${{ inputs.mode }}
          IN_SINCE: ${{ inputs.since }}
          IN_ONLY_FROM: ${{ inputs.only_from }}
          IN_SUBJECT: ${{ inputs.subject_contains }}
        run: |
          set -euo pipefail
          mode="${IN_MODE:-}"
          if [ -z "$mode" ]; then
            if [ "${LIVE_ENABLED:-}" = "true" ]; then mode=live; else mode=dry-run; fi
          fi
          args=()
          case "$mode" in
            check) args+=(--check) ;;
            dry-run) args+=(--dry-run) ;;
            live) ;;
            *) echo "::error::Unknown mode: $mode"; exit 1 ;;
          esac
          if [ "$mode" = "live" ] && [ -z "${IN_SINCE:-}" ] && [ "${LIVE_ENABLED:-}" != "true" ]; then
            echo "::error::Rolling live processing is disabled (repository variable ORDER_INTAKE_LIVE is not 'true'). For a one-off import use 'since' with 'only_from' or 'subject_contains'."
            exit 1
          fi
          if [ -n "${IN_SINCE:-}" ]; then args+=(--since "$IN_SINCE"); fi
          if [ -n "${IN_ONLY_FROM:-}" ]; then args+=(--only-from "$IN_ONLY_FROM"); fi
          if [ -n "${IN_SUBJECT:-}" ]; then args+=(--subject-contains "$IN_SUBJECT"); fi
          echo "Order intake mode: $mode"
          python order_intake_poll.py "${args[@]}"
