name: License expiry alert

# Runs the standalone license expiry email alert once per day.
# This does NOT use the Streamlit runtime — it is a plain Python process.

on:
  schedule:
    # Daily at 06:00 UTC. Adjust if you prefer a different local time.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      days_before:
        description: "Days before expiry to check (blank = use Settings-configured default, e.g. 1,3)"
        required: false
        default: ""
      dry_run:
        description: "Dry run - preview only, do not send email or log it as sent"
        required: false
        default: "true"
        type: boolean
      force:
        description: "Force send even if this alert was already logged as sent"
        required: false
        default: "false"
        type: boolean
      to_override:
        description: "Override recipient email(s), comma-separated (optional, for testing)"
        required: false
        default: ""

concurrency:
  group: license-expiry-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run license expiry alert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
          EMAIL_DEFAULT_RECIPIENTS: ${{ secrets.EMAIL_DEFAULT_RECIPIENTS }}
          EMAIL_DEFAULT_CC: ${{ secrets.EMAIL_DEFAULT_CC }}
        run: |
          ARGS="--source supabase"
          if [ -n "${{ github.event.inputs.days_before }}" ]; then
            ARGS="$ARGS --days-before ${{ github.event.inputs.days_before }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.to_override }}" ]; then
            ARGS="$ARGS --to ${{ github.event.inputs.to_override }}"
          fi
          echo "Running: python license_expiry_alert.py $ARGS"
          python license_expiry_alert.py $ARGS
