name: Supabase Backup → OneDrive

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC (04:00 Israel time)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg lsb-release ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "Installed at: /usr/lib/postgresql/17/bin/pg_dump"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests supabase

      - name: Run backup and upload to OneDrive
        env:
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAPH_TENANT_ID:       ${{ secrets.GRAPH_TENANT_ID || secrets.ORDER_INTAKE_GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID:       ${{ secrets.GRAPH_CLIENT_ID || secrets.ORDER_INTAKE_GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET:   ${{ secrets.GRAPH_CLIENT_SECRET || secrets.ORDER_INTAKE_GRAPH_CLIENT_SECRET }}
          ONEDRIVE_USER_EMAIL:   ${{ secrets.ONEDRIVE_USER_EMAIL }}
          # Use the PGDG-installed v17 binary directly - the runner's pre-installed
          # v16 client otherwise wins on $PATH.
          PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
          # Optional overrides (defaults match your current Supabase project):
          # SUPABASE_HOST: aws-1-ap-southeast-1.pooler.supabase.com
          # SUPABASE_USER: postgres.rdoxihpmghrvroddnkdi
          # ONEDRIVE_FOLDER: Backups/Supabase
          # BACKUP_KEEP_COUNT: "30"
        run: python backup_to_onedrive.py

      - name: Prune Ask Data shadow log (read-only diagnostics, 30-day retention)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Never financial data; safe to run even before the ask_data_shadow_log table exists (no-op then).
        run: python scripts/prune_ask_data_shadow_log.py --older-than-days 30 --apply

      - name: Run daily Ask Data invoice history snapshot (Phase 5)
        if: always()
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Captures today's (UTC) invoices-table state into invoice_snapshots/invoice_snapshot_runs so Ask
        # Data's historical/trend tools (get_debt_at, get_debt_change, etc. -- gated behind
        # ask_data_history, editor/admin-only for now) can answer "what was the debt on date X" without
        # ever touching the live invoices/projects tables. See snapshot_invoice_history.py's module
        # docstring for the full idempotency/audit-log/failure-handling design.
        #
        # `if: always()` makes this step run independently of the backup/prune steps above: a backup
        # hiccup must never silently skip today's snapshot, and vice versa. Read-only against
        # invoices/projects/bank_payments/invoice_change_log; the ONLY tables ever written are the two new,
        # purely-additive history tables above -- a failure here can never affect the CRM. The script exits
        # non-zero on failure, which marks this step (and so this workflow run) as failed in the Actions
        # tab rather than leaving a silent gap.
        run: python snapshot_invoice_history.py
